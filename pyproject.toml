[project]
name = "ravand-agents"
version = "0.0.0"
description = "Modular agent control plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ravand-cli",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ravand-sessions",
    "ravand-audit",
    "ravand-hooks",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ravand-cli = { workspace = true }
ravand-policy = { workspace = true }
ravand-profile = { workspace = true }
ravand-registry = { workspace = true }
ravand-runtime = { workspace = true }
ravand-permissions = { workspace = true }
ravand-sessions = { workspace = true }
ravand-audit = { workspace = true }
ravand-hooks = { workspace = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
