# Reading: docs/README.md
# Previous: examples/harness.toml
# Next: AGENTS.md, Adopted product rules

default_profile = "personal"
audit_bodies = false

[profiles.work]
home = "~/.ravand/profiles/work"
allow = ["claude", "grok", "cursor"]

[profiles.personal]
home = "~/.ravand/profiles/personal"
allow = ["kimi", "grok", "opencode", "dsh"]

# Id is local to the profile. kind is cli | api. API keys stay in the vault.
[accounts.grok-work]
kind = "cli"
agent = "grok"

[accounts.claude-api]
kind = "api"
provider = "anthropic"
secret_ref = "vault:work/claude-api"
