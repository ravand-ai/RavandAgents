[project]
name = "ravand-cli"
version = "0.0.0"
description = "ravand command-line interface"
requires-python = ">=3.12"
dependencies = [
    "ravand-policy",
    "ravand-profile",
    "ravand-registry",
    "ravand-runtime",
]

[project.scripts]
ravand = "ravand_cli.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
